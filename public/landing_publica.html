<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reservas Ulima</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/landing_publica.css">
</head>

<body>
  
    <div class="parte-principal p-5">

      <h1 class="mb-2" style="font-family: Manrope; font-size: 50px; color: rgba(21, 35, 34); font-weight:bolder;">
        Reserva salas, laboratorios y cabinas <br>
        del campus por bloques de una hora
      </h1>

      <p style="color: rgba(106, 122, 120); font-family: Inter; font-size: 20px;">
        Consulta la disponibilidad de la semana, elige tu bloque y confirma en menos de un minuto.
      </p>
      
      <div class="formulario-busqueda">
        <div class="agrupar-vertical">

          <label for="sede" class="form-label" style="font-family: Inter; font-size: 15px; font-weight: bolder; color: rgba(106, 122, 120)">
            SEDE
          </label>

          <select id="sede" class="form-select" style="font-family: Inter; font-size: 18px; color: rgba(21, 35, 34)">
            <option selected>Campus Monterrico</option>
            <option value="1">Campus Mayorazgo</option> 
          </select>
          
        </div>

        <div class="agrupar-vertical" style="margin-left: 12px;">

          <label for="tipo" class="form-label" style="font-family: Inter; font-size: 15px; font-weight: bolder; color: rgba(106, 122, 120)">
            TIPO DE ESPACIO
          </label>

          <select id="tipo" class="form-select" style="font-family: Inter; font-size: 18px; color: rgba(21, 35, 34)">
            <option selected>Sala de estudio grupal</option>
            <option value="1">Laboratorio de cómputo</option>
            <option value="2">Cabina de grabación</option>
            <option value="3">Auditorio</option>
            <option value="4">Sala de reuniones</option>
          </select>
          
        </div>

        <div class="agrupar-vertical" style="margin-left: 12px;">

          <label for="dia" class="form-label" style="font-family: Inter; font-size: 15px; font-weight: bolder; color: rgba(106, 122, 120)">
            DÍA
          </label>

          <input id="dia" name="dia" type="text" placeholder="DD/MM/AAAA" class="form-control" style="font-family: Inter; font-size: 18px; color: rgba(21, 35, 34)">

        </div>
        
    

        <div class="agrupar-vertical" style="margin-left: 12px;">
            <button type="button" class="btn btn-dark" style="font-family: Inter; font-weight: bolder">
             Buscar
            </button>
        </div>

        </div>

      </div>

    </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
